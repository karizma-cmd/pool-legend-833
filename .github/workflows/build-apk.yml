name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع النسخة (Debug أو Release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses & Install Android 36 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: 5. Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: 6. Build Web App (Vite)
        run: |
          npm run build

      - name: 7. Sync Capacitor Android
        run: |
          npx cap sync android

      - name: 8. Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: 9. Build Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}"
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 10. Build Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' }}"
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 11. Rename & Organize APK
        run: |
          mkdir -p build-output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/PoolLegends-3D-v1.0-debug.apk
            echo "Copied debug APK successfully"
          fi
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/PoolLegends-3D-v1.0-release-unsigned.apk
            echo "Copied release APK successfully"
          fi

      - name: 12. Upload APK Artifact (Downloadable in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PoolLegends-3D-Android-APK
          path: build-output/*.apk
          retention-days: 30
